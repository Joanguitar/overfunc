[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overfunc"
version = "0.1.1"
description = "function overloads"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["measurements"]
classifiers = [
    "Framework :: Pytest",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/Joanguitar/overfunc"
Repository = "https://github.com/Joanguitar/overfunc"
Issues = "https://github.com/Joanguitar/overfunc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=overfunc",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:coverage",
]

[tool.coverage.report]
exclude_also = ["except ImportError:"]